<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <!-- ENCABEZADO -->

    <div class="mb-4">

        <h1>
            Bienvenido, {{ current_user.nombre }}
        </h1>

        <p class="text-muted">
            Gestión Financiera Personal
        </p>

    </div>


    <!-- SITUACIÓN FINANCIERA -->

    <h2 class="mb-4">
        Situación financiera
    </h2>

    <div class="row mb-5">

        <!-- INGRESOS -->

        <div class="col-md-4 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Total de ingresos
                    </h5>

                    <p class="fs-3 mb-0">
                        ${{ total_ingresos }}
                    </p>

                </div>

            </div>

        </div>


        <!-- GASTOS -->

        <div class="col-md-4 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Total de gastos
                    </h5>

                    <p class="fs-3 mb-0">
                        ${{ total_gastos }}
                    </p>

                </div>

            </div>

        </div>


        <!-- BALANCE -->

        <div class="col-md-4 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Balance
                    </h5>

                    <p class="fs-3 mb-0">
                        ${{ balance }}
                    </p>

                </div>

            </div>

        </div>

    </div>


    <!-- ACCIONES -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h2 class="h4 mb-4">
                Acciones
            </h2>

            <div class="d-flex gap-2 flex-wrap">

                <a
                    href="{{ url_for('gastos.nuevo') }}"
                    class="btn btn-primary"
                >
                    Nuevo gasto
                </a>

                <a
                    href="{{ url_for('ingresos.nuevo') }}"
                    class="btn btn-success"
                >
                    Nuevo ingreso
                </a>

            </div>

        </div>

    </div>


    <!-- CONSULTAS -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h2 class="h4 mb-4">
                Consultas
            </h2>

            <a
                href="{{ url_for('resumen.mostrar') }}"
                class="btn btn-secondary"
            >
                Ver resumen
            </a>

        </div>

    </div>


    <!-- CERRAR SESIÓN -->

    <div class="text-end">

        <a
            href="{{ url_for('auth.logout') }}"
            class="btn btn-danger"
        >
            Cerrar sesión
        </a>

    </div>

</div>

</body>

</html>
